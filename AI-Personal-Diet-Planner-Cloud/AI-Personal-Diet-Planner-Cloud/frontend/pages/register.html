<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — plateWise</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="/">plate<span>wise</span></a></div>
    <div class="nav-links"><a href="/pages/login.html">Log in</a></div>
  </div>

  <div class="wrap">
    <h1>Create your account</h1>
    <p class="subtitle">Demo data only — use a fake name and any email you like.</p>

    <div class="form-card">
      <form id="register-form">
        <label for="name">Name</label>
        <input id="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" minlength="8" required>

        <button type="submit">Create account</button>
      </form>
      <div id="msg"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");
      msg.innerHTML = "";
      try {
        const data = await Api.register(name, email, password);
        Api.setToken(data.token);
        Api.setUser(data.user);
        window.location.href = "/pages/profile.html";
      } catch (err) {
        msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
