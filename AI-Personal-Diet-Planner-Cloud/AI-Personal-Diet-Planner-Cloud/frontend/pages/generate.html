<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generate a plan — plateWise</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="/">plate<span>wise</span></a></div>
    <div class="nav-links">
      <a href="/pages/dashboard.html">Dashboard</a>
      <a href="#" id="logout-link">Log out</a>
    </div>
  </div>

  <div class="wrap">
    <h1>Generate today's plan</h1>
    <p class="subtitle">Uses your saved profile by default — override anything just for this plan below.</p>

    <div class="form-card">
      <form id="generate-form">
        <label for="dietary_preference">Dietary preference</label>
        <select id="dietary_preference">
          <option value="">Use my profile setting</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="non_vegetarian">Non-vegetarian</option>
        </select>

        <label for="goal">Goal</label>
        <select id="goal">
          <option value="">Use my profile setting</option>
          <option value="general balanced eating">General balanced eating</option>
          <option value="weight-management demo">Weight-management demo</option>
          <option value="fitness-oriented demo">Fitness-oriented demo</option>
        </select>

        <button type="submit">Generate plan</button>
      </form>
      <div id="msg"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    Api.requireLogin();

    document.getElementById("generate-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.innerHTML = `<div class="plan-meta">Generating…</div>`;
      const overrides = {};
      const pref = document.getElementById("dietary_preference").value;
      const goal = document.getElementById("goal").value;
      if (pref) overrides.dietary_preference = pref;
      if (goal) overrides.goal = goal;

      try {
        const data = await Api.generatePlan(overrides);
        sessionStorage.setItem("latest_plan", JSON.stringify(data));
        window.location.href = "/pages/plan_result.html";
      } catch (err) {
        msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    });

    document.getElementById("logout-link").addEventListener("click", async (e) => {
      e.preventDefault();
      await Api.logout();
      Api.clearToken();
      window.location.href = "/";
    });
  </script>
</body>
</html>
